<div id="gallerySettingsPage" data-role="page" class="page type-interior pluginConfigurationPage configPage" data-require="emby-input,emby-button">
    <div data-role="content">
        <div class="content-primary">
            <h1>Gallery Plugin Configuration</h1>

            <form id="galleryConfigForm" class="configForm" novalidate>
                <div class="inputContainer">
                    <input
                        id="txtGalleryFolderName"
                        type="text"
                        is="emby-input"
                        required="required"
                        label="Gallery Folder Name" />
                    <div class="fieldDescription">
                        The name of the folder inside each movie directory that contains gallery images.
                        For example, if set to <code>gallery</code>, the plugin will look for images in
                        <code>&lt;MovieFolder&gt;/gallery/</code>.
                    </div>
                </div>

                <div class="inputContainer">
                    <div id="galleryConfigStatus" class="fieldDescription"></div>
                </div>

                <div>
                    <button is="emby-button" type="submit" class="raised button-submit block btnSave">
                        <span>Save</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

<script type="text/javascript">
(function () {
    'use strict';

    // Hard-coded plugin ID — Jellyfin 12's web client no longer provides
    // the getParameterByName() helper, so read the URL ourselves and fall
    // back to the known ID. Must match Plugin.Id in Plugin.cs.
    var PLUGIN_ID = 'D2C8A4B6-7E3F-4A9B-8C1D-5F6E7A8B9C0D';

    /* ---- Config page handlers ---- */
    function getPage() {
        return document.getElementById('gallerySettingsPage');
    }

    function getPluginId() {
        try {
            var params = new URLSearchParams(window.location.search);
            var id = params.get('id') || params.get('pluginId');
            if (id) { return id; }
            var hash = window.location.hash || '';
            var qIndex = hash.indexOf('?');
            if (qIndex !== -1) {
                var hashParams = new URLSearchParams(hash.substring(qIndex + 1));
                id = hashParams.get('id') || hashParams.get('pluginId');
                if (id) { return id; }
            }
        } catch (e) {
            console.warn('Gallery Plugin: failed to parse plugin ID from URL.', e);
        }
        return PLUGIN_ID;
    }

    function setStatus(message) {
        var page = getPage();
        if (!page) { return; }
        var status = page.querySelector('#galleryConfigStatus');
        if (status) { status.textContent = message; }
    }

    function loadConfig() {
        var page = getPage();
        if (!page) { return; }

        if (window.Dashboard && Dashboard.showLoadingMsg) {
            Dashboard.showLoadingMsg();
        }

        ApiClient.getPluginConfiguration(getPluginId()).then(function (config) {
            page.querySelector('#txtGalleryFolderName').value = (config && config.GalleryFolderName) || 'gallery';
            setStatus('');
            if (window.Dashboard && Dashboard.hideLoadingMsg) {
                Dashboard.hideLoadingMsg();
            }
        }).catch(function (err) {
            console.error('Gallery Plugin: Failed to load configuration.', err);
            setStatus('Load failed');
            if (window.Dashboard && Dashboard.hideLoadingMsg) {
                Dashboard.hideLoadingMsg();
            }
        });
    }

    function saveConfig() {
        var page = getPage();
        if (!page) { return false; }

        if (window.Dashboard && Dashboard.showLoadingMsg) {
            Dashboard.showLoadingMsg();
        }
        setStatus('Saving...');

        ApiClient.getPluginConfiguration(getPluginId()).then(function (config) {
            config = config || {};
            config.GalleryFolderName = page.querySelector('#txtGalleryFolderName').value;
            return ApiClient.updatePluginConfiguration(getPluginId(), config);
        }).then(function (result) {
            try {
                if (window.Dashboard && Dashboard.processPluginConfigurationUpdateResult) {
                    Dashboard.processPluginConfigurationUpdateResult(result);
                }
            } catch (e) {
                console.error('Gallery Plugin: failed to process save result.', e);
            }
            setStatus('Settings saved');
            if (window.Dashboard && Dashboard.hideLoadingMsg) {
                Dashboard.hideLoadingMsg();
            }
        }).catch(function (err) {
            console.error('Gallery Plugin: Failed to save configuration.', err);
            setStatus('Save failed');
            if (window.Dashboard && typeof Dashboard.alert === 'function') {
                Dashboard.alert('Unable to save plugin settings.');
            }
            if (window.Dashboard && Dashboard.hideLoadingMsg) {
                Dashboard.hideLoadingMsg();
            }
        });

        return false;
    }

    function bindPage() {
        var page = getPage();
        if (!page || page.dataset.galleryBound === 'true') { return; }
        page.dataset.galleryBound = 'true';

        // Jellyfin 12 fires 'pageshow'; older clients fire 'pagebeforeshow'.
        page.addEventListener('pageshow', function () { loadConfig(); });
        page.addEventListener('pagebeforeshow', function () { loadConfig(); });

        var form = page.querySelector('form');
        if (form) {
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                return saveConfig();
            });
        }

        loadConfig();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bindPage);
    } else {
        bindPage();
    }
    // Re-bind when the SPA injects the page markup after navigation.
    new MutationObserver(bindPage).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
</div>
